[project]
name = "rss-mcp-scheduler"
version = "0.1.0"
description = "Temporal worker that durably refreshes rss-mcp subscriptions over its MCP HTTP endpoint."
readme = "README.md"
license = "MIT"
authors = [{ name = "HUANG Cheng" }]
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
rss-mcp-worker = "rss_mcp_scheduler.worker:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_mcp_scheduler"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]