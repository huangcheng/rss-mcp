services:
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=${TEMPORAL_POSTGRES_PASSWORD}
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal-data:/etc/temporal
    depends_on:
      - temporal-postgres
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.30.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  worker:
    build: ../../scheduler
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - RSS_MCP_URL=https://rss.wuhan.dev/mcp
      - RSS_MCP_TOKEN=${RSS_MCP_TOKEN}
      - RSS_MCP_REFRESH_INTERVAL=30
    depends_on:
      - temporal
    restart: unless-stopped

volumes:
  temporal-data:
  temporal-postgres: